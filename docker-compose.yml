version: '3.9'

services:
  backend:
    build: ./backend
    ports:
      - "2000:2000"
    environment:
      - FRONTEND_URL=http://localhost:3000
    container_name: bench_backend

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://backend:2000
      - REACT_APP_PUBLIC_URL=http://localhost:3000
    depends_on:
      - backend
    container_name: bench_frontend

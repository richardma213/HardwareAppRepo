const degree = {};
data.links.forEach(l => { degree[l.source] = (degree[l.source]||0)+1; degree[l.target] = (degree[l.target]||0)+1; });
const G = ForceGraph3D()(document.getElementById('graph'))
  .graphData(data)
  .nodeAutoColorBy('group')
  .nodeVal(n => 1 + (degree[n.id]||0) / 2)
  .nodeLabel(n => `<b>${n.label}</b><br>${n.file}`)
  .linkLabel(l => l.relation)
  .linkOpacity(0.25)
  .linkDirectionalParticles(1)
  .linkDirectionalParticleWidth(1.2)
  .onNodeClick(focus);
function focus(n) {
  const d = 90, r = 1 + d / Math.hypot(n.x, n.y, n.z);
  G.cameraPosition({ x: n.x*r, y: n.y*r, z: n.z*r }, n, 1200);
  document.getElementById('sel').innerHTML = `<br><b>${n.label}</b><br>${n.file}<br>${degree[n.id]||0} connections`;
}
document.getElementById('q').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const q = e.target.value.toLowerCase();
  const n = data.nodes.find(n => n.label.toLowerCase().includes(q) || n.file.toLowerCase().includes(q));
  if (n) focus(n);
});
